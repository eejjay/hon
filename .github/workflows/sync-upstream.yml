name: Sync upstream (gvigroux/hon)

# Merges new commits from the original integration into this fork every night,
# keeping the local "silent AC" patch on top. On a merge conflict nothing is
# pushed and an issue is opened so it can be resolved by hand.

on:
  schedule:
    - cron: "17 3 * * *"   # daily, 03:17 UTC
  workflow_dispatch:        # manual run from the Actions tab

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/gvigroux/hon.git
  UPSTREAM_BRANCH: master
  TARGET_BRANCH: master

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM_REPO"
          git fetch upstream "$UPSTREAM_BRANCH"

      - name: Merge upstream
        id: merge
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git merge-base --is-ancestor "upstream/$UPSTREAM_BRANCH" HEAD; then
            echo "Already up to date with upstream."
            echo "result=uptodate" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git merge --no-edit "upstream/$UPSTREAM_BRANCH" \
               -m "Merge upstream gvigroux/hon $(git rev-parse --short upstream/$UPSTREAM_BRANCH)"; then
            echo "result=merged" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U > conflicts.txt || true
            git merge --abort
            echo "result=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Check patch still present
        if: steps.merge.outputs.result == 'merged'
        run: |
          grep -q "_force_silent_ac(device.appliance_type" custom_components/hon/hon.py
          grep -q "_force_silent_ac(typeName" custom_components/hon/hon.py
          python -m py_compile custom_components/hon/*.py

      - name: Push
        if: steps.merge.outputs.result == 'merged'
        run: git push origin "HEAD:$TARGET_BRANCH"

      - name: Open issue on conflict
        if: steps.merge.outputs.result == 'conflict'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const files = fs.existsSync('conflicts.txt') ? fs.readFileSync('conflicts.txt', 'utf8').trim() : '';
            const title = 'Upstream sync: merge conflict';
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open'
            });
            if (open.data.some(i => i.title === title)) {
              core.info('Conflict issue already open, not creating another.');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo, title,
              body: `Upstream gvigroux/hon could not be merged automatically.\n\n` +
                    `Conflicting files:\n\`\`\`\n${files || '(unknown)'}\n\`\`\`\n\n` +
                    `Resolve by merging \`upstream/master\` locally and re-applying the ` +
                    `\`_force_silent_ac\` patch in \`custom_components/hon/hon.py\`.\n\n` +
                    `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            core.setFailed('Merge conflict with upstream; issue opened.');
